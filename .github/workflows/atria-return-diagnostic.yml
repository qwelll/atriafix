name: Atria Return Diagnostic qwellldiag1
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  THEOS: ${{ github.workspace }}/theos-roothide
  HOMEBREW_NO_AUTO_UPDATE: 1
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - name: Clean pinned upstream and diagnostic only
        run: |
          set -euo pipefail
          git clone https://github.com/CySxL/Atria.git atria-source
          git -C atria-source checkout 97487ef45c7bbd335f5f69d7a5568dbf44175ec7
          test -z "$(git -C atria-source status --porcelain)"
          git -C atria-source apply --check ../patches/Atria-ReturnDiagnostic-qwellldiag1.patch
          git -C atria-source apply ../patches/Atria-ReturnDiagnostic-qwellldiag1.patch
          mkdir -p deliverables
          cp atria-source/DIAGNOSTIC-TESTING.txt deliverables/
          cp patches/Atria-ReturnDiagnostic-qwellldiag1.patch deliverables/
          git -C atria-source diff --stat
          xcodebuild -version
          git -C theos-roothide rev-parse HEAD > deliverables/THEOS-COMMIT.txt
          git -C theos-roothide submodule status >> deliverables/THEOS-COMMIT.txt
          tar --exclude=.git -czf deliverables/Atria-1.9.3+qwellldiag1-GPL-source.tar.gz atria-source
      - name: Install dependencies and SDK 16.5
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          stage="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$stage/sdks"
          git -C "$stage/sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$stage/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          git -C "$stage/sdks" rev-parse HEAD > deliverables/SDK-COMMIT.txt
      - name: Build diagnostic Atria RootHide real dual arch
        working-directory: atria-source
        run: |
          set -euo pipefail
          set +e
          make package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET=iphone:clang:16.5:15.0 > ../deliverables/build.log 2>&1
          result=$?
          cat ../deliverables/build.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          for line in Path('../deliverables/build.log').read_text().splitlines():
              line = re.sub(r'\x1b\[[0-9;]*m', '', line)
              if 'error:' in line or 'fatal error:' in line:
                  print('::error::'+line.replace('%','%25').replace('\r','%0D'))
          PY
          test "$result" -eq 0
          for deb in packages/*.deb; do dpkg-deb -I "$deb"; dpkg-deb -c "$deb"; cp "$deb" ../deliverables/; done
      - uses: actions/upload-artifact@v4
        with:
          name: Atria-ReturnDiagnostic-qwellldiag1-RootHide-${{ github.run_id }}
          path: deliverables/*
          if-no-files-found: error
