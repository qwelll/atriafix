name: Atria iOS17 ReturnScale Source Fix
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  THEOS: ${{ github.workspace }}/theos-roothide
  HOMEBREW_NO_AUTO_UPDATE: 1
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - name: Fetch pinned upstream and apply patch
        run: |
          set -euo pipefail
          git clone https://github.com/CySxL/Atria.git atria-source
          git -C atria-source checkout 97487ef45c7bbd335f5f69d7a5568dbf44175ec7
          git -C atria-source apply --check ../patches/Atria-iOS17-ReturnScale.patch
          git -C atria-source apply ../patches/Atria-iOS17-ReturnScale.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('atria-source/layout/DEBIAN/control')
          p.write_text(p.read_text().replace('Version: 1.9.3','Version: 1.9.3+qwelllfix1'))
          PY
      - name: Install dependencies and SDK
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          stage="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$stage/sdks"
          git -C "$stage/sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$stage/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build patched Atria for RootHide
        working-directory: atria-source
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET=iphone:clang:16.5:15.0
          for deb in packages/*.deb; do dpkg-deb -I "$deb"; dpkg-deb -c "$deb"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Atria-iOS17-ReturnScaleFix-RootHide
          path: atria-source/packages/*.deb
          if-no-files-found: error
