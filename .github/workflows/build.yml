name: Build AtriaZoomGuard RootHide

on:
  push:
    branches: [main, master]
    paths-ignore: ['README.md', 'packages/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos-roothide
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Checkout RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - name: Install dependencies and SDK
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          SDK_STAGE="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
      - name: Build RootHide package
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e"
          for deb in packages/*.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
            shasum -a 256 "$deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AtriaZoomGuard-RootHide
          path: packages/*.deb
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: roothide-${{ github.run_number }}
          name: AtriaZoomGuard RootHide build ${{ github.run_number }}
          files: packages/*.deb
